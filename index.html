    <script>
        const productsByBarcode = {};
        const productsList = [];

        (function loadData() {
            const rawText = document.getElementById('embeddedData').textContent.trim();
            const lines = rawText.split('\n');
            for (let i = 1; i < lines.length; i++) {
                const parts = lines[i].split('\t');
                if (parts.length >= 3) {
                    const name = parts[0].trim();
                    const price = parts[1].trim();
                    const barcode = parts[2].trim();
                    if (barcode && name) {
                        const item = { name, price, barcode };
                        productsByBarcode[barcode] = item;
                        productsList.push(item);
                    }
                }
            }
        })();

        const searchInput = document.getElementById('searchInput');
        const singleResult = document.getElementById('singleResult');
        const nameDisplay = document.getElementById('nameDisplay');
        const priceDisplay = document.getElementById('priceDisplay');
        const resultsList = document.getElementById('resultsList');
        let resetTimer;
        let html5QrcodeScanner;

        document.addEventListener('click', (e) => {
            if (!e.target.classList.contains('key') && !e.target.closest('.result-item') && e.target.id !== 'cameraBtn') {
                searchInput.focus();
            }
        });

        document.getElementById('cameraBtn').addEventListener('click', () => {
            const readerDiv = document.getElementById('reader');
            if (readerDiv.style.display === 'block') {
                if (html5QrcodeScanner) {
                    html5QrcodeScanner.stop().then(() => {
                        readerDiv.style.display = 'none';
                    }).catch(err => console.log(err));
                }
            } else {
                readerDiv.style.display = 'block';
                singleResult.style.display = 'none';
                resultsList.style.display = 'none';
                if (!html5QrcodeScanner) {
                    html5QrcodeScanner = new Html5Qrcode("reader");
                }
                html5QrcodeScanner.start(
                    { facingMode: "environment" }, 
                    { fps: 10, qrbox: { width: 250, height: 250 } },
                    (decodedText) => {
                        html5QrcodeScanner.stop().then(() => {
                            readerDiv.style.display = 'none';
                            searchInput.value = decodedText;
                            handleSearch(decodedText);
                        });
                    },
                    (errorMessage) => { }
                ).catch(err => {
                    alert("برجاء إعطاء صلاحية الكاميرا للمتصفح");
                    readerDiv.style.display = 'none';
                });
            }
        });

        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const query = searchInput.value.trim();
                if (productsByBarcode[query]) {
                    showSingleProduct(productsByBarcode[query].name, productsByBarcode[query].price);
                } else if (/^\d+$/.test(query)) {
                    showSingleProduct("عفواً، الصنف غير مسجل", "");
                }
            }
        });

        searchInput.addEventListener('input', function() {
            handleSearch(searchInput.value.trim());
        });

        function handleSearch(term) {
            clearTimeout(resetTimer);
            if (!term) {
                clearView();
                return;
            }

            if (productsByBarcode[term]) {
                showSingleProduct(productsByBarcode[term].name, productsByBarcode[term].price);
                return;
            }

            const cleanTerm = term.toLowerCase();
            const matches = productsList.filter(item => item.name.toLowerCase().includes(cleanTerm));

            if (matches.length > 0) {
                displayResultsList(matches);
            } else if (!/^\d+$/.test(term)) {
                resultsList.style.display = 'block';
                singleResult.style.display = 'none';
                resultsList.innerHTML = '<div style="font-size: 1.2em; color: #ffd166; padding: 10px;">لا توجد أصناف مطابقة لهذا الاسم</div>';
            }

            setResetTimer();
        }

        function showSingleProduct(name, price) {
            resultsList.style.display = 'none';
            singleResult.style.display = 'flex';
            nameDisplay.textContent = name;
            
            if (price) {
                nameDisplay.style.color = "#ffffff";
                priceDisplay.innerHTML = price + ' <span class="currency">جنيه</span>';
            } else {
                nameDisplay.style.color = "#ff4444";
                priceDisplay.textContent = "";
            }
            searchInput.value = '';
            setResetTimer();
        }

        function displayResultsList(items) {
            singleResult.style.display = 'none';
            resultsList.style.display = 'block';
            resultsList.innerHTML = '';

            items.slice(0, 15).forEach(item => {
                const row = document.createElement('div');
                row.className = 'result-item';
                row.innerHTML = `<span>${item.name}</span><span class="item-price">${item.price} ج</span>`;
                row.onclick = () => showSingleProduct(item.name, item.price);
                resultsList.appendChild(row);
            });
        }

        function setResetTimer() {
            clearTimeout(resetTimer);
            resetTimer = setTimeout(clearView, 9000);
        }

        function clearView() {
            searchInput.value = '';
            singleResult.style.display = 'none';
            resultsList.style.display = 'none';
            nameDisplay.textContent = '';
            priceDisplay.textContent = '';
            const readerDiv = document.getElementById('reader');
            if(readerDiv.style.display === 'block' && html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => readerDiv.style.display = 'none');
            }
        }

        document.querySelectorAll('.keyboard .key').forEach(button => {
            button.addEventListener('click', (e) => {
                e.preventDefault();
                const char = button.textContent;

                if (button.id === 'backspaceKey') {
                    searchInput.value = searchInput.value.slice(0, -1);
                } else if (button.id === 'spaceKey') {
                    searchInput.value += ' ';
                } else if (button.id === 'clearKey') {
                    clearView();
                    return;
                } else {
                    searchInput.value += char;
                }
                
                handleSearch(searchInput.value.trim());
                searchInput.focus();
            });
        });
    </script>
